name: Prepare SFTPGo source images

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  identity:
    if: github.repository == 'TheApeironLab/apeiron-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.lock.outputs.revision }}
      go-version: ${{ steps.lock.outputs.go-version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: lock
        run: |
          python3 - <<'PY'
          import json,os,re
          item=json.load(open('release/platform-images.json'))['sourceBuilds']['sftpgo']
          assert item['repository']=='TheApeironLab/sftpgo'
          assert re.fullmatch('[a-f0-9]{40}',item['revision'])
          assert re.fullmatch(r'\d+\.\d+\.\d+',item['goVersion'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('revision='+item['revision']+'\ngo-version='+item['goVersion']+'\n')
          PY
  images:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheApeironLab/sftpgo
          ref: ${{ needs.identity.outputs.revision }}
          persist-credentials: false
          path: source
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ needs.identity.outputs.go-version }}
          cache-dependency-path: source/go.sum
      - name: Build and run the reviewed SFTPGo binary on its native architecture
        env:
          ARCHITECTURE: ${{ matrix.architecture }}
        run: python3 coordinator/scripts/build-sftpgo-image.py --source "$GITHUB_WORKSPACE/source" --arch "$ARCHITECTURE" --out "$RUNNER_TEMP/sftpgo"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: platform-sftpgo-${{ matrix.architecture }}
          path: ${{ runner.temp }}/sftpgo
          compression-level: 0
          retention-days: 14
