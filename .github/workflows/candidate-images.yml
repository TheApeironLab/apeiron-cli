name: Coordinated nightly image candidates

on:
  workflow_call:
    inputs:
      apeiron_revision:
        required: true
        type: string
      chentu_revision:
        required: true
        type: string

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - id: identity
        env:
          APEIRON_REVISION: ${{ inputs.apeiron_revision }}
          CHENTU_REVISION: ${{ inputs.chentu_revision }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export GITHUB_RUN_CREATED_AT=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .created_at)
          bun scripts/prepare-candidate.js "$RUNNER_TEMP/candidate"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-identity
          path: ${{ runner.temp }}/candidate
          retention-days: 7

  images:
    needs: identity
    strategy:
      fail-fast: false
      matrix:
        component: [backend, app, ops, scode]
        architecture: [amd64, arm64]
    runs-on: ${{ matrix.architecture == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-22.04' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: coordinator
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: TheApeironLab/apeiron
          ref: ${{ inputs.apeiron_revision }}
          token: ${{ secrets.ZYGOS_READ_TOKEN }}
          persist-credentials: false
          path: apeiron
      - name: Build the pinned application source with the shared nightly identity
        env:
          RELEASE_VERSION: ${{ needs.identity.outputs.version }}
          APEIRON_REVISION: ${{ inputs.apeiron_revision }}
          COMPONENT: ${{ matrix.component }}
          ARCHITECTURE: ${{ matrix.architecture }}
          GH_TOKEN: ${{ secrets.ZYGOS_READ_TOKEN }}
        run: bash coordinator/scripts/build-candidate-image.sh "$GITHUB_WORKSPACE/apeiron" "$RUNNER_TEMP/image"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ matrix.component }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/image
          compression-level: 0
          retention-days: 7
