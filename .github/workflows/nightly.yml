name: Unified nightly

on:
  schedule:
    - cron: '0 19 * * *' # 03:00 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-distribution-scheduler
  cancel-in-progress: false

jobs:
  schedule:
    if: github.repository == 'TheApeironLab/apeiron-cli' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Prepare or build a reviewed coordinated distribution
        run: bun scripts/schedule-distribution.js
        env:
          GH_TOKEN: ${{ github.token }}
