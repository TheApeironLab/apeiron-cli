name: Unified release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Standalone CLI run for this exact version tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unified-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate configured acceptance environments and immutable build source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ACCEPTANCE_READY: ${{ vars.RELEASE_ACCEPTANCE_READY }}
        run: |
          bun scripts/check-release-run.js
          test "$ACCEPTANCE_READY" = true || { echo '::error::Configure all four disposable acceptance runners before releasing.'; exit 1; }
      - name: Validate the reviewed distribution inputs against compiled pins
        run: bun scripts/check-distribution-source.js release/distribution-input.json
      - id: version
        run: bun -e 'import {version} from "./scripts/version.js"; console.log("version=" + version)' >> "$GITHUB_OUTPUT"
      - name: Download the original four-platform build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: ${{ runner.temp }}/release
          retention-days: 7

  acceptance:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        target: [k3d-darwin-arm64, k3d-linux-arm64, k3s-single-amd64, k3s-multi-amd64]
    # These labels refer exclusively to disposable acceptance machines, never
    # production or the existing shared development clusters. PRs cannot run here.
    runs-on: [self-hosted, apeiron-release, '${{ matrix.target }}']
    timeout-minutes: 110
    concurrency:
      group: release-acceptance-${{ matrix.target }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: ${{ runner.temp }}/release
      - name: Install the exact candidate and verify the live cluster
        env:
          ACCEPTANCE_TARGET: ${{ matrix.target }}
        run: bun scripts/accept-distribution.js "$ACCEPTANCE_TARGET" "$RUNNER_TEMP/release" "$PWD/release/distribution-input.json" "$RUNNER_TEMP/acceptance-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-${{ matrix.target }}
          path: ${{ runner.temp }}/acceptance-${{ github.run_id }}-${{ github.run_attempt }}/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 30
      # Raw configs, kubeconfigs, tokens and installation logs remain private on
      # the disposable runner. Only the bounded result receipt is uploaded.

  publish:
    needs: [candidate, acceptance]
    runs-on: ubuntu-22.04
    concurrency:
      group: cli-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: acceptance-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Bind the complete acceptance matrix to the release
        run: bun scripts/finalize-distribution.js "$RUNNER_TEMP/release" "$PWD/release/distribution-input.json" "$RUNNER_TEMP/receipts"
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.OSS_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.OSS_ROLE_ARN }}
          role-session-name: apeiron-unified-release
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: 3.3.23
      - run: bun scripts/publish-release.js "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_REGION_ID: cn-beijing
          ALIBABA_CLOUD_IGNORE_PROFILE: 'TRUE'
