name: Unified release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Standalone CLI run for this exact version tag
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: unified-release
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      targets: ${{ steps.version.outputs.targets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate configured acceptance environments and immutable build source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          ACCEPTANCE_READY: ${{ vars.RELEASE_ACCEPTANCE_READY }}
        run: |
          bun scripts/check-release-run.js
          test "$ACCEPTANCE_READY" = true || { echo '::error::Configure both ARM64 runners and native ECS leases before releasing.'; exit 1; }
      - name: Validate the reviewed distribution inputs against compiled pins
        run: bun scripts/check-distribution-source.js release/distribution-input.json
      - id: version
        run: bun -e 'import {version} from "./scripts/version.js"; import {requiredTargets} from "./scripts/lib/distribution.js"; console.log("version=" + version + "\ntargets=" + JSON.stringify(requiredTargets(version)))' >> "$GITHUB_OUTPUT"
      - name: Download the original four-platform build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: gh run download "$BUILD_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate
          path: ${{ runner.temp }}/release
          retention-days: 7

  acceptance:
    needs: candidate
    strategy:
      fail-fast: false
      matrix:
        # nightly: both K3d hosts; stable: also native single and three-server K3s.
        target: ${{ fromJSON(needs.candidate.outputs.targets) }}
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: TheApeironLab/apeiron-cli/.github/workflows/release-acceptance.yml@main
    with:
      target: ${{ matrix.target }}

  publish:
    needs: [candidate, acceptance]
    runs-on: ubuntu-22.04
    concurrency:
      group: cli-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: candidate
          path: ${{ runner.temp }}/release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: acceptance-*
          merge-multiple: true
          path: ${{ runner.temp }}/receipts
      - name: Bind the complete acceptance matrix to the release
        run: bun scripts/finalize-distribution.js "$RUNNER_TEMP/release" "$PWD/release/distribution-input.json" "$RUNNER_TEMP/receipts"
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6
        with:
          oidc-provider-arn: ${{ vars.OSS_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.OSS_ROLE_ARN }}
          role-session-name: apeiron-unified-release
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5
        with:
          version: 3.3.23
      - name: Select the pinned CLI and initialize OSS before uploads
        run: bash scripts/prepare-release-aliyun.sh
      - run: bun scripts/publish-release.js "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_REGION_ID: cn-beijing
          ALIBABA_CLOUD_IGNORE_PROFILE: 'TRUE'
