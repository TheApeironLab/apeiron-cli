name: Standalone CLI

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      candidate:
        description: Build coordinated nightly image candidates without publishing
        type: boolean
        default: false
      apeiron_revision:
        description: Full Apeiron source commit for the candidate
        type: string
      chentu_revision:
        description: Full Chentu source commit for the candidate
        type: string
      candidate_version:
        description: Build unpublished CLI artifacts for an existing coordinated candidate version
        type: string

env:
  APEIRON_BUILD_VERSION: ${{ inputs.candidate_version || '' }}

permissions:
  contents: read
  actions: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate-images:
    if: github.event_name == 'workflow_dispatch' && inputs.candidate && !startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/candidate-images.yml
    with:
      apeiron_revision: ${{ inputs.apeiron_revision }}
      chentu_revision: ${{ inputs.chentu_revision }}
    secrets: inherit

  release-contracts:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Validate unpublished CLI candidate request
        if: inputs.candidate_version != ''
        env:
          CANDIDATE_IMAGES: ${{ inputs.candidate }}
        run: |
          bun -e 'import {version} from "./scripts/version.js"; if (process.env.CANDIDATE_IMAGES === "true" || process.env.GITHUB_REF.startsWith("refs/tags/")) throw new Error("CLI candidates require an existing coordinated version on a branch; image preparation is a separate run")'
      - name: Release and installer contracts without cloud credentials
        run: |
          bun test test/distribution.test.js test/release-version.test.js test/nightly-release.test.js test/release-publication.test.js test/release-provenance.test.js test/installer.test.js test/deployment-publication.test.js test/deployment-signature.test.js test/configure-release.test.js
          python3 -m unittest discover -s test -p 'test_release_*.py'
      - name: Build version validation
        run: |
          rustc --edition=2021 --test runtime/build_version.rs -o "$RUNNER_TEMP/build-version-tests"
          "$RUNNER_TEMP/build-version-tests"

  registry-tooling:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install the same registry exporter as material preparation
        run: sudo apt-get update && sudo apt-get install -y skopeo
      - name: Export a small pinned public image and verify its real OCI graph
        run: |
          python3 - <<'PY'
          import importlib.util,os,pathlib,subprocess
          spec=importlib.util.spec_from_file_location('exporter','scripts/export-platform-image.py')
          exporter=importlib.util.module_from_spec(spec);spec.loader.exec_module(exporter)
          digest='sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662'
          archive=pathlib.Path(os.environ['RUNNER_TEMP'])/'busybox.oci.tar'
          subprocess.run(['skopeo','copy','--all','--preserve-digests','docker://docker.io/library/busybox@'+digest,'oci-archive:'+str(archive)],check=True)
          print('Verified registry export platforms:',exporter.verify_archive(archive,digest))
          PY

  checks:
    needs: [release-contracts, registry-tooling]
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || inputs.candidate_version != ''
    runs-on: ubuntu-22.04
    steps:
      - name: Require private submodule read credential
        env:
          ZYGOS_READ_TOKEN: ${{ secrets.ZYGOS_READ_TOKEN }}
        run: |
          if [ -z "$ZYGOS_READ_TOKEN" ]; then
            echo '::error::Configure ZYGOS_READ_TOKEN with Contents: read for TheApeironLab/apeiron-cli, TheApeironLab/zygos, TheApeironLab/apeiron and TheApeironLab/apeiron-iam. The default GITHUB_TOKEN cannot read the private upstream submodules.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          # Read-only token for this host and all pinned upstream repositories.
          token: ${{ secrets.ZYGOS_READ_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve release version
        run: bun scripts/configure-release.js
      - name: Verify committed distribution pins when present
        run: |
          if [ -f release/distribution-input.json ]; then bun scripts/check-distribution-source.js release/distribution-input.json; fi
      - run: rustup show
      - run: bun install --frozen-lockfile
      - run: bun scripts/embed-assets.js --check
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # Dependency unit tests are not run by the host's cargo test. Keep the
      # receiver checks that moved out of runtime/src active at their source.
      - name: Vendored Apeiron CLI checks
        working-directory: third_party/apeiron/cli
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - name: Vendored IAM CLI checks
        working-directory: third_party/apeiron-iam/cli
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
      - run: bun run check
      - run: cargo build --locked --bin apeiron --example build-support
      - name: CLI and wizard HTTP contracts against Rust
        run: APEIRON_TEST_BIN="$PWD/target/debug/apeiron" bun test
      - name: Browser wizard against Rust
        run: |
          bunx playwright install --with-deps chromium
          bun scripts/test-ui.js "$PWD/target/debug/apeiron"
          bun scripts/test-deployment-stages.js
          bun scripts/test-instances-ui.js "$PWD/target/debug/apeiron"
          bun scripts/test-base-models-ui.js
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun -e 'import {version} from "./scripts/version.js"; if (process.env.GITHUB_REF !== "refs/tags/v" + version) process.exit(1)'

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-musl
          - runner: macos-15
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            target: darwin-x64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require private submodule read credential
        env:
          ZYGOS_READ_TOKEN: ${{ secrets.ZYGOS_READ_TOKEN }}
        run: |
          if [ -z "$ZYGOS_READ_TOKEN" ]; then
            echo '::error::Configure ZYGOS_READ_TOKEN with Contents: read for TheApeironLab/apeiron-cli, TheApeironLab/zygos, TheApeironLab/apeiron and TheApeironLab/apeiron-iam. The default GITHUB_TOKEN cannot read the private upstream submodules.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          # Read-only token for this host and all pinned upstream repositories.
          token: ${{ secrets.ZYGOS_READ_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve release version
        run: bun scripts/configure-release.js
      - name: Install native build target
        env:
          RUST_TARGET: ${{ matrix.triple }}
        run: rustup target add "$RUST_TARGET"
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Rust release archive
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build:release "$RUNNER_TEMP/release" "$TARGET"
      - name: Smoke test executable without Bun on PATH
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/release/apeiron-"*"-$TARGET.tar.gz" -C "$RUNNER_TEMP/smoke"
          bun run test:release "$RUNNER_TEMP/smoke/apeiron"
      - name: Smoke test minimal Linux image
        if: runner.os == 'Linux'
        run: docker run --rm -v "$RUNNER_TEMP/smoke:/candidate:ro" -v "$PWD/scripts:/checks:ro" ubuntu:22.04 bash /checks/smoke-linux.sh
      - name: Verify selections against the public default install package
        # The current pinned Chentu package provides a native ARM64 toolbox.
        # Run real Helmfile and check.py, without a cluster or container network.
        if: matrix.target == 'linux-arm64'
        run: bun scripts/test-install-plan.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Require private submodule read credential
        env:
          ZYGOS_READ_TOKEN: ${{ secrets.ZYGOS_READ_TOKEN }}
        run: |
          if [ -z "$ZYGOS_READ_TOKEN" ]; then
            echo '::error::Configure ZYGOS_READ_TOKEN with Contents: read for TheApeironLab/apeiron-cli, TheApeironLab/zygos, TheApeironLab/apeiron and TheApeironLab/apeiron-iam. The default GITHUB_TOKEN cannot read the private upstream submodules.'
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
          # Read-only token for this host and all pinned upstream repositories.
          token: ${{ secrets.ZYGOS_READ_TOKEN }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Resolve release version
        run: bun scripts/configure-release.js
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - run: bun scripts/finalize-release.js "$RUNNER_TEMP/release"
      - name: Verify system installation from a non-admin shell
        run: |
          release_version=$(bun -e 'import {version} from "./scripts/version.js"; console.log(version)')
          docker run --rm -e APEIRON_TEST_VERSION="$release_version" -v "$RUNNER_TEMP/release:/release:ro" -v "$PWD/scripts:/checks:ro" ubuntu:22.04 bash /checks/test-system-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7

  coordinate:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      actions: write
    steps:
      - name: Continue through the unified acceptance and publication gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run unified-release.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f "build_run_id=$GITHUB_RUN_ID"
