name: Standalone CLI

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - run: rustup show
      - run: bun install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: bun run typecheck && bun test
      - run: cargo build --locked
      - name: Replay CLI and wizard HTTP contracts against Rust
        run: APEIRON_TEST_BIN="$PWD/target/debug/apeiron" bun test test/chat.test.ts test/cli.test.ts test/init.test.ts
      - name: Browser wizard against Rust
        run: |
          bunx playwright install --with-deps chromium
          bun scripts/test-ui.ts "$PWD/target/debug/apeiron"
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun -e 'import {version} from "./scripts/version.ts"; if (process.env.GITHUB_REF !== "refs/tags/v" + version) process.exit(1)'

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
            triple: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: linux-arm64
            triple: aarch64-unknown-linux-musl
          - runner: macos-15
            target: darwin-arm64
            triple: aarch64-apple-darwin
          - runner: macos-15-intel
            target: darwin-x64
            triple: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install native build target
        env:
          RUST_TARGET: ${{ matrix.triple }}
        run: rustup target add "$RUST_TARGET"
      - name: Install static Linux linker
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build Rust release archive
        env:
          TARGET: ${{ matrix.target }}
        run: bun run build:release "$RUNNER_TEMP/release" "$TARGET"
      - name: Smoke test executable without Bun on PATH
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/release/apeiron-"*"-$TARGET.tar.gz" -C "$RUNNER_TEMP/smoke"
          bun run test:release "$RUNNER_TEMP/smoke/apeiron"
      - name: Smoke test minimal Linux image
        if: runner.os == 'Linux'
        run: docker run --rm -v "$RUNNER_TEMP/smoke:/candidate:ro" -v "$PWD/scripts:/checks:ro" ubuntu:22.04 bash /checks/smoke-linux.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release
          retention-days: 7

  package:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          merge-multiple: true
          path: ${{ runner.temp }}/release
      - run: bun scripts/finalize-release.ts "$RUNNER_TEMP/release"
      - name: Verify system installation from a non-admin shell
        run: |
          release_version=$(bun -e 'import {version} from "./scripts/version.ts"; console.log(version)')
          docker run --rm -e APEIRON_TEST_VERSION="$release_version" -v "$RUNNER_TEMP/release:/release:ro" -v "$PWD/scripts:/checks:ro" ubuntu:22.04 bash /checks/test-system-install.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.OSS_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.OSS_ROLE_ARN }}
          role-session-name: apeiron-cli-release
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: 3.3.23
      - run: bun scripts/publish-release.ts "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_REGION_ID: cn-beijing
          ALIBABA_CLOUD_IGNORE_PROFILE: 'TRUE'
