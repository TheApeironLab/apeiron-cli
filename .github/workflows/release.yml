name: Standalone CLI

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: standalone-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun test
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: bun -e 'if (process.env.GITHUB_REF !== "refs/tags/v" + (await Bun.file("package.json").json()).version) process.exit(1)'
      - run: bun run build:release "$RUNNER_TEMP/release"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - name: Smoke test both Linux architectures without Bun
        run: |
          for arch in x64 arm64; do
            mkdir -p "$RUNNER_TEMP/smoke-$arch"
            tar -xzf "$RUNNER_TEMP/release/apeiron-"*"-linux-$arch.tar.gz" -C "$RUNNER_TEMP/smoke-$arch"
            platform=amd64
            [ "$arch" != arm64 ] || platform=arm64
            docker run --rm --platform "linux/$platform" -v "$RUNNER_TEMP/smoke-$arch:/candidate:ro" -v "$PWD/scripts:/checks:ro" ubuntu:22.04 bash /checks/smoke-linux.sh
          done
      - run: bun scripts/finalize-release.ts "$RUNNER_TEMP/release"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: ${{ runner.temp }}/release
          retention-days: 7

  macos:
    needs: build
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
          path: ${{ runner.temp }}/release
      - name: Smoke test macOS binary
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          tar -xzf "$RUNNER_TEMP/release/apeiron-"*"-$TARGET.tar.gz" -C "$RUNNER_TEMP/smoke"
          bun run test:release "$RUNNER_TEMP/smoke/apeiron"

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, macos]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release
          path: ${{ runner.temp }}/release
      - uses: aliyun/configure-aliyun-credentials-action@1e5248c8d5d93a8781ac344a68e19a43341e79e6 # v1
        with:
          oidc-provider-arn: ${{ vars.OSS_OIDC_PROVIDER_ARN }}
          role-to-assume: ${{ vars.OSS_ROLE_ARN }}
          role-session-name: apeiron-cli-release
      - uses: aliyun/setup-aliyun-cli-action@09a5f86915bb556e27bf050e9a5e339aeb073df5 # v1
        with:
          version: 3.3.23
      - run: bun scripts/publish-release.ts "$RUNNER_TEMP/release"
        env:
          GH_TOKEN: ${{ github.token }}
          ALIBABA_CLOUD_REGION_ID: cn-beijing
          ALIBABA_CLOUD_IGNORE_PROFILE: 'TRUE'
