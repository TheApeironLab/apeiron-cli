[package]
name = "apeiron"
# Placeholder: the binary's version comes from ../VERSION via build.rs.
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Run the apeiron agent on your own machine"
license = "UNLICENSED"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.6", features = ["derive", "env"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }
# tokio-tungstenite enables TLS without a crypto provider; wss:// otherwise aborts at startup.
rustls = { version = "=0.23.44", default-features = false, features = ["ring"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["fs", "io-std", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "=0.24.0", features = ["rustls-tls-native-roots"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
