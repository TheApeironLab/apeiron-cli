[package]
name = "zygos-cli"
version = "0.1.0"
autobins = false
edition = "2024"
rust-version = "1.85"
description = "Reusable Zygos HTTP command-line client"
publish = false

[lib]
name = "zygos_cli"

[dependencies]
base64 = "=0.22.1"
getrandom = "=0.3.4"
percent-encoding = "=2.3.2"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "multipart", "stream", "json"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
tempfile = "=3.27.0"
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "macros", "signal", "fs", "io-util", "io-std", "net", "time"] }
tokio-util = { version = "=0.7.18", features = ["io"] }

[workspace]
